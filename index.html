<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ministry Scheduler</title>
  <meta name="description" content="Schedule ministers, worship, tech and preachers, and plan sermon series by month.">
  <meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes light.
    try { const t = localStorage.getItem('ministry-scheduler:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="24" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h26M10 2v6M22 2v6M16 15v10M12 19h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <div>
        <span class="eyebrow">Ministry Scheduler</span>
        <span id="church-name" class="church">Our Church</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/schedule" data-tab="schedule">Schedule</a>
      <a href="#/preaching" data-tab="preaching">Preaching</a>
      <a href="#/ministers" data-tab="ministers">Ministers</a>
      <a href="#/series" data-tab="series">Series</a>
      <a href="#/settings" data-tab="settings">Settings</a>
    </nav>
  </header>

  <div id="month-nav" class="month-nav">
    <button class="icon-btn" data-action="prev" aria-label="Previous month">&lsaquo;</button>
    <h1 id="month-label" aria-live="polite">Month</h1>
    <button class="icon-btn" data-action="next" aria-label="Next month">&rsaquo;</button>
    <button class="btn small" data-action="today">This month</button>
  </div>

  <main id="view" class="view"></main>

  <dialog id="modal" aria-label="Editor"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="empty">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
