<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Ministry Scheduler</title>
  <meta name="description" content="Schedule ministers, worship, tech and preachers, and plan sermon series by month.">
  <meta name="theme-color" content="#121729">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint so dark mode never flashes light.
    try { const t = localStorage.getItem('ministry-scheduler:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}
    // iOS Safari ignores user-scalable=no, so block pinch zoom by hand.
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  </script>
</head>
<body>
  <aside class="rail">
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="5" y="8" width="30" height="28" rx="6" fill="#C9A45C"/>
        <rect x="11.5" y="3.5" width="4" height="9.5" rx="2" fill="#C9A45C" stroke="#121729" stroke-width="1.6"/>
        <rect x="24.5" y="3.5" width="4" height="9.5" rx="2" fill="#C9A45C" stroke="#121729" stroke-width="1.6"/>
        <path d="M20 16v15M14.5 21.5h11" stroke="#121729" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Ministry Scheduler</span>
        <span id="church-name" class="church">Our Church</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Sections">
      <a href="#/schedule" data-tab="schedule">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>
        <span>Schedule</span></a>
      <a href="#/preaching" data-tab="preaching">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>
        <span>Preaching</span></a>
      <a href="#/tasks" data-tab="tasks">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 6.5 1.5 1.5 3-3M4 12.5 5.5 14l3-3M4 18.5 5.5 20l3-3M12 7h8M12 13h8M12 19h8"/></svg>
        <span>Tasks</span></a>
      <a href="#/ministers" data-tab="ministers">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.4 0 4 1.5 4.5 4"/></svg>
        <span>Ministers</span></a>
      <a href="#/series" data-tab="series">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Series</span></a>
      <a href="#/settings" data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Settings</span></a>
    </nav>
    <button id="mine-btn" class="rail-bell" data-action="mine" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
      <span class="bell-text">Your schedule</span><span class="bell-count" hidden></span>
    </button>
    <button id="account-btn" class="rail-foot" data-action="account" data-state="local">
      <svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.4 9.1 4.5 4.5 0 0 0 7 18z"/></svg>
      <span class="sync-dot" aria-hidden="true"></span>
      <span class="account-copy"><span class="account-text">Saved in this browser</span><span class="account-sub"></span></span>
    </button>
  </aside>

  <div class="main">
    <header class="page-head">
      <div class="head-top">
        <span id="page-eyebrow" class="page-eyebrow">Schedule</span>
        <button class="today-btn" data-action="today">This month</button>
      </div>
      <div class="head-row">
        <h1 id="month-label" aria-live="polite">Month</h1>
        <div id="month-nav" class="month-nav">
          <button class="icon-btn nav-prev" data-action="prev" aria-label="Previous month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="icon-btn nav-next" data-action="next" aria-label="Next month"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
        <div id="page-actions" class="page-actions"></div>
      </div>
      <p id="page-sub" class="page-sub" hidden></p>
      <div id="head-extra" class="head-extra"></div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <dialog id="modal" aria-label="Editor"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="empty">This app needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
